name: Build & Push Image

# Manually triggered: Actions tab -> "Build & Push Image" -> Run workflow.
# Builds the production image and pushes it to GHCR as
# ghcr.io/<owner>/wip-song:<tag>.
#
# Architecture: one NATIVE job per arch (amd64 on ubuntu-latest, arm64 on
# GitHub's native arm runner ubuntu-24.04-arm — free for public repos), each
# pushing <tag>-<arch>, then a stitch job welds the per-arch images into one
# multi-arch index under the bare <tag> via `docker buildx imagetools create`
# (manifest-only, no rebuild). No QEMU anywhere. The stitch job only runs if
# BOTH arch builds succeed, so a bare <tag> is never a half-index, and both
# halves are always built from the same commit.
#
# Tag convention: version tags (e.g. 1.0.0, 20260703a) are write-once — never
# re-push an existing version, bump instead. An empty tag input falls back to
# sha-<short>. The per-arch tags (<tag>-amd64, <tag>-arm64) are provenance;
# deploys pin the bare <tag>.
#
# The image is built at Vite's default base '/': the app is served at the root
# of its own origin (https://song.<host>/), with no base path.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (e.g. 1.0.0). Leave empty for sha-<short-commit>.'
        required: false
        default: ''

jobs:
  resolve-tag:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve image tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short HEAD)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Building with tag: $TAG (arch images: $TAG-amd64, $TAG-arm64)"

  build:
    needs: resolve-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (${{ matrix.arch }}, native)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx build \
            --build-arg VITE_BUILD_STAMP="$(date -u +%FT%TZ)" \
            --build-arg VITE_BUILD_SHA="$(git rev-parse --short HEAD)" \
            -t "ghcr.io/${{ github.repository_owner }}/wip-song:${{ needs.resolve-tag.outputs.tag }}-${{ matrix.arch }}" \
            --push .

  stitch:
    # Runs only if BOTH arch builds succeeded — a bare <tag> is never a
    # half-index, and both halves come from this run's single commit.
    needs: [resolve-tag, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Stitch per-arch images into a multi-arch tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          TAG="${{ needs.resolve-tag.outputs.tag }}"
          IMG="ghcr.io/${{ github.repository_owner }}/wip-song"
          docker buildx imagetools create \
            -t "$IMG:$TAG" \
            "$IMG:$TAG-amd64" \
            "$IMG:$TAG-arm64"
          docker buildx imagetools inspect "$IMG:$TAG" | head -20
          echo "Done: $TAG is a multi-arch index (amd64+arm64) for wip-song."
